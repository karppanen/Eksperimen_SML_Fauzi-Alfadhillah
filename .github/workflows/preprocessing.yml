name: Preprocess Dataset

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  preprocess:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r preprocessing/requirements.txt

      - name: Run preprocessing
        working-directory: preprocessing
        run: |
          python automate_Fauzi-Alfadhillah.py --input ../CustomerSegmentation_raw.csv --output-dir CustomerSegmentation_preprocessing

      - name: Upload preprocessed dataset
        uses: actions/upload-artifact@v4
        with:
          name: customer-segmentation-preprocessed
          path: preprocessing/CustomerSegmentation_preprocessing/
